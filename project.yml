name: Pokedex

options:
  bundleIdPrefix: com.salvattore315
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Pokedex:
    type: application
    platform: iOS
    sources:
      - path: Pokedex
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salvattore315.Pokedex
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PokedexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PokedexTests
    dependencies:
      - target: Pokedex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salvattore315.PokedexTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pokedex:
    build:
      targets:
        Pokedex: all
        PokedexTests: [test]
    test:
      targets:
        - PokedexTests
